name: Master Goal verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-${{ matrix.node }}
          path: benchmarks/latest.json
  host-canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --prefix .host-v1 opencode-ai@1.18.34
      - run: npm install --prefix .host-v2 @opencode/cli@2.0.22
      - run: node scripts/host-canary-v1.mjs "$PWD/.host-v1/node_modules/.bin/opencode"
      - run: node scripts/host-canary-v2.mjs "$PWD/.host-v2/node_modules/.bin/opencode"
      - run: BUN_BE_BUN=1 .host-v2/node_modules/.bin/opencode --conditions=browser scripts/tui-canary.mjs
      - run: node scripts/install-canary.mjs
