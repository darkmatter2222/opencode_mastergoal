name: Publish Master Goal release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml, releases/v0.4.1.md]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-v0.4.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_COMMIT: f2beb48bc2043788bc6a1604ede33c98489c9a9d
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve release notes and require successful CI
        run: |
          cp releases/v0.4.1.md "$RUNNER_TEMP/release-notes.md"
          gh api "repos/$GH_REPO/actions/runs?head_sha=$RELEASE_COMMIT&status=success" --jq '.workflow_runs[] | select(.name == "Master Goal verification" and .event == "push") | .id' > "$RUNNER_TEMP/verified-runs"
          test -s "$RUNNER_TEMP/verified-runs"
          git fetch origin "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build release artifact
        run: |
          test "$(node -p 'require("./package.json").version')" = 0.4.1
          npm pack
          sha256sum darkmatter2222-opencode-mastergoal-0.4.1.tgz > SHA256SUMS
      - name: Publish v0.4.1
        run: |
          if gh release view v0.4.1 > /dev/null 2>&1; then
            echo 'v0.4.1 is already published; leaving it unchanged.'
            exit 0
          fi
          gh release create v0.4.1 darkmatter2222-opencode-mastergoal-0.4.1.tgz SHA256SUMS --target "$RELEASE_COMMIT" --title 'v0.4.1 — Plain Markdown forever loops' --notes-file "$RUNNER_TEMP/release-notes.md" --latest
